<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">dsh-mnemon v0.2.0 three-tier memory architecture</title>
  <desc id="desc">DSH Web, conversation, and Headless surfaces enter the dsh-mnemon control plane, then connect Runtime, Documents, and replaceable-provider Memory Spaces. Independent task Agents perform model-guided work.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#21314d" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9ba8bc"/></marker>
    <marker id="arrowAgent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6558d9"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}.bg{fill:#f7f9fc}.section{fill:#eef2f8;stroke:#d7deea;stroke-width:1.5}.card{fill:#fff;stroke:#d7deea;stroke-width:1.5;filter:url(#shadow)}.hot{fill:#fff7e9;stroke:#d99238}.doc{fill:#edf4ff;stroke:#5489d7}.long{fill:#eaf8f2;stroke:#34a27b}.agent{fill:#f4f0ff;stroke:#8b7de3}.title{font-size:38px;font-weight:760}.sub{font-size:17px;fill:#647086}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.1px;fill:#6558d9}.h{font-size:21px;font-weight:720}.copy{font-size:15px;fill:#647086}.small{font-size:13px;fill:#647086}.pill{fill:#fff;stroke:#cad3e0}.pillText{font-size:13px;font-weight:650}.line{fill:none;stroke:#9ba8bc;stroke-width:2.5;marker-end:url(#arrow)}.agentLine{fill:none;stroke:#6558d9;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowAgent)}
  </style>
  <rect class="bg" width="1600" height="900" rx="24"/>
  <text class="title" x="64" y="62">dsh-mnemon v0.2.0 three-tier architecture</text>
  <text class="sub" x="64" y="92">Host-managed first two tiers · Replaceable third-tier Providers · Current instructions and live facts always win</text>

  <text class="eyebrow" x="64" y="140">01 · USER AND AGENT SURFACES</text>
  <g aria-label="User surfaces">
    <rect class="card" x="64" y="160" width="430" height="112" rx="18"/>
    <text class="h" x="90" y="202">Sidebar WebUI</text><text class="copy" x="90" y="232">Status · Runtime · Documents · Memory Spaces</text><text class="small" x="90" y="255">Progressive loading, visualization, confirmations</text>
    <rect class="card" x="585" y="160" width="430" height="112" rx="18"/>
    <text class="h" x="611" y="202">Conversation UI</text><text class="copy" x="611" y="232">Turn memory · Save to memory · exact navigation</text><text class="small" x="611" y="255">Fits the native DSH answer-action model</text>
    <rect class="card" x="1106" y="160" width="430" height="112" rx="18"/>
    <text class="h" x="1132" y="202">Headless · Tools · Commands</text><text class="copy" x="1132" y="232">Per-turn injection · on-demand recall · /mnemon</text><text class="small" x="1132" y="255">Same workspace and permission boundary without WebUI</text>
  </g>

  <path class="line" d="M279 272v36h1042v42"/><path class="line" d="M800 272v78"/><path class="line" d="M1321 272v78"/>
  <rect class="section" x="48" y="330" width="1504" height="248" rx="24"/>
  <text class="eyebrow" x="76" y="366">02 · DSH-MNEMON CONTROL PLANE</text>
  <g aria-label="Control plane">
    <rect class="card" x="76" y="392" width="430" height="148" rx="18"/>
    <text class="h" x="102" y="430">Deterministic Host and RPC</text><text class="copy" x="102" y="460">schema · path · permission · lock · revision · capacity</text><text class="copy" x="102" y="487">concurrent reads · timeout · cancellation · receipts</text><text class="small" x="102" y="516">Status, direct search, and ordinary edits need no model</text>
    <rect class="card agent" x="585" y="392" width="430" height="148" rx="18"/>
    <text class="h" x="611" y="430">Independent top-level task Agents</text><text class="copy" x="611" y="460">Remember · Agent Query · AI metadata · Archive</text><text class="copy" x="611" y="487">No main-session history · dedicated model route optional</text><text class="small" x="611" y="516">Tasks are isolated; local failure stays on its surface</text>
    <rect class="card" x="1094" y="392" width="430" height="148" rx="18"/>
    <text class="h" x="1120" y="430">Provider registry and routing</text><text class="copy" x="1120" y="460">Service configuration ≠ Memory Space instance</text><text class="copy" x="1120" y="487">Hard rules first · prompt resolves genuine ambiguity</text><text class="small" x="1120" y="516">Credentials stay in the Host, outside browser and Agent</text>
  </g>

  <path class="line" d="M291 540v72"/><path class="agentLine" d="M800 540v72"/><path class="line" d="M1309 540v72"/>
  <text class="eyebrow" x="64" y="626">03 · THREE DATA TIERS</text>
  <g aria-label="Memory tiers">
    <rect class="card hot" x="64" y="650" width="430" height="176" rx="20"/>
    <text class="h" x="90" y="692">Runtime Memory</text><text class="copy" x="90" y="722">Every-turn preferences, rules, and environment facts</text><text class="small" x="90" y="752">memories.json → USER.md / MEMORY.md</text><text class="small" x="90" y="780">Local · deterministic · compact injection</text><rect class="pill" x="90" y="794" width="150" height="26" rx="13"/><text class="pillText" x="165" y="812" text-anchor="middle">dsh-mnemon managed</text>
    <rect class="card doc" x="585" y="650" width="430" height="176" rx="20"/>
    <text class="h" x="611" y="692">Project Documents</text><text class="copy" x="611" y="722">Designs, investigations, procedures, and handoffs</text><text class="small" x="611" y="752">index.json + active / archived Markdown</text><text class="small" x="611" y="780">Local · deterministic search · cold-reference archive</text><rect class="pill" x="611" y="794" width="150" height="26" rx="13"/><text class="pillText" x="686" y="812" text-anchor="middle">dsh-mnemon managed</text>
    <rect class="card long" x="1106" y="650" width="430" height="176" rx="20"/>
    <text class="h" x="1132" y="692">Long-term Memory Spaces</text><text class="copy" x="1132" y="722">Cross-task facts, decisions, entities, and relations</text><text class="small" x="1132" y="752">Concurrent active-space recall · truthful projections</text><text class="small" x="1132" y="780">Global / workspace / Provider-native namespaces</text><rect class="pill" x="1132" y="794" width="166" height="26" rx="13"/><text class="pillText" x="1215" y="812" text-anchor="middle">Replaceable Provider</text>
  </g>

  <text class="small" x="64" y="865">Mnemon · OpenViking · Honcho · Mem0 · Hindsight · Holographic · RetainDB · ByteRover · Supermemory</text>
  <line x1="1230" y1="860" x2="1274" y2="860" stroke="#9ba8bc" stroke-width="2.5"/><text class="small" x="1285" y="865">Deterministic</text>
  <line x1="1402" y1="860" x2="1446" y2="860" stroke="#6558d9" stroke-width="2.5" stroke-dasharray="8 7"/><text class="small" x="1457" y="865">Agent path</text>
</svg>
