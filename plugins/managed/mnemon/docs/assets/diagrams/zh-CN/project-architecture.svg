<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" lang="zh-CN">
  <title id="title">dsh-mnemon v0.2.0 三层记忆架构</title>
  <desc id="desc">DSH 的 Web、对话和 Headless 入口经过 dsh-mnemon 控制面，连接运行时、档案和可替换 Provider 的记忆体；独立任务 Agent 执行需要模型判断的工作。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#21314d" flood-opacity=".08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9ba8bc"/></marker>
    <marker id="arrowAgent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6558d9"/></marker>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.bg{fill:#f7f9fc}.section{fill:#eef2f8;stroke:#d7deea;stroke-width:1.5}.card{fill:#fff;stroke:#d7deea;stroke-width:1.5;filter:url(#shadow)}.hot{fill:#fff7e9;stroke:#d99238}.doc{fill:#edf4ff;stroke:#5489d7}.long{fill:#eaf8f2;stroke:#34a27b}.agent{fill:#f4f0ff;stroke:#8b7de3}.title{font-size:38px;font-weight:760}.sub{font-size:17px;fill:#647086}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1.1px;fill:#6558d9}.h{font-size:21px;font-weight:720}.copy{font-size:15px;fill:#647086}.small{font-size:13px;fill:#647086}.pill{fill:#fff;stroke:#cad3e0}.pillText{font-size:13px;font-weight:650}.line{fill:none;stroke:#9ba8bc;stroke-width:2.5;marker-end:url(#arrow)}.agentLine{fill:none;stroke:#6558d9;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrowAgent)}
  </style>
  <rect class="bg" width="1600" height="900" rx="24"/>
  <text class="title" x="64" y="62">dsh-mnemon v0.2.0 三层记忆架构</text>
  <text class="sub" x="64" y="92">前两层由 Host 确定性管理 · 第三层可替换 Provider · 当前指令与实时事实始终优先</text>

  <text class="eyebrow" x="64" y="140">01 · 用户与 AGENT 入口</text>
  <g aria-label="用户入口">
    <rect class="card" x="64" y="160" width="430" height="112" rx="18"/>
    <text class="h" x="90" y="202">Sidebar WebUI</text><text class="copy" x="90" y="232">状态 · 运行时 · 档案 · 记忆体 · 设置</text><text class="small" x="90" y="255">渐进加载、可视化与用户确认入口</text>
    <rect class="card" x="585" y="160" width="430" height="112" rx="18"/>
    <text class="h" x="611" y="202">对话内入口</text><text class="copy" x="611" y="232">本回合记忆 · 存入记忆 · 精确跳转</text><text class="small" x="611" y="255">沿用 DSH 原生回复操作心智</text>
    <rect class="card" x="1106" y="160" width="430" height="112" rx="18"/>
    <text class="h" x="1132" y="202">Headless · 工具 · 命令</text><text class="copy" x="1132" y="232">每轮注入 · 按需检索 · /mnemon</text><text class="small" x="1132" y="255">没有 WebUI，仍使用相同工作区与权限边界</text>
  </g>

  <path class="line" d="M279 272v36h1042v42"/><path class="line" d="M800 272v78"/><path class="line" d="M1321 272v78"/>
  <rect class="section" x="48" y="330" width="1504" height="248" rx="24"/>
  <text class="eyebrow" x="76" y="366">02 · DSH-MNEMON 控制面</text>
  <g aria-label="控制面">
    <rect class="card" x="76" y="392" width="430" height="148" rx="18"/>
    <text class="h" x="102" y="430">确定性 Host 与 RPC</text><text class="copy" x="102" y="460">schema · 路径 · 权限 · 锁 · revision · 容量</text><text class="copy" x="102" y="487">并发读取 · 超时 · 取消 · 渐进回执</text><text class="small" x="102" y="516">状态、直接检索、普通编辑不调用模型</text>
    <rect class="card agent" x="585" y="392" width="430" height="148" rx="18"/>
    <text class="h" x="611" y="430">独立顶层任务 Agent</text><text class="copy" x="611" y="460">沉淀 · Agent 查询 · AI 元信息 · 归档</text><text class="copy" x="611" y="487">无主会话历史 · 可单独选择模型路由</text><text class="small" x="611" y="516">任务互相隔离，局部失败只回写自身表面</text>
    <rect class="card" x="1094" y="392" width="430" height="148" rx="18"/>
    <text class="h" x="1120" y="430">Provider 注册与智能路由</text><text class="copy" x="1120" y="460">服务配置 ≠ 记忆体实例</text><text class="copy" x="1120" y="487">硬规则先筛选 · Prompt 只解决真实歧义</text><text class="small" x="1120" y="516">凭据只留在 Host，不进入浏览器或 Agent</text>
  </g>

  <path class="line" d="M291 540v72"/><path class="agentLine" d="M800 540v72"/><path class="line" d="M1309 540v72"/>
  <text class="eyebrow" x="64" y="626">03 · 三层数据面</text>
  <g aria-label="三层记忆">
    <rect class="card hot" x="64" y="650" width="430" height="176" rx="20"/>
    <text class="h" x="90" y="692">运行时记忆</text><text class="copy" x="90" y="722">每轮需要的偏好、约定与环境事实</text><text class="small" x="90" y="752">memories.json → USER.md / MEMORY.md</text><text class="small" x="90" y="780">本地 · 确定性 · 紧凑注入</text><rect class="pill" x="90" y="794" width="136" height="26" rx="13"/><text class="pillText" x="158" y="812" text-anchor="middle">dsh-mnemon 管理</text>
    <rect class="card doc" x="585" y="650" width="430" height="176" rx="20"/>
    <text class="h" x="611" y="692">项目档案</text><text class="copy" x="611" y="722">设计、调查、流程、复盘与交接全文</text><text class="small" x="611" y="752">index.json + active / archived Markdown</text><text class="small" x="611" y="780">本地 · 确定性检索 · 冷引用归档</text><rect class="pill" x="611" y="794" width="136" height="26" rx="13"/><text class="pillText" x="679" y="812" text-anchor="middle">dsh-mnemon 管理</text>
    <rect class="card long" x="1106" y="650" width="430" height="176" rx="20"/>
    <text class="h" x="1132" y="692">长期记忆体</text><text class="copy" x="1132" y="722">跨任务事实、决策、实体与关系</text><text class="small" x="1132" y="752">已激活实例并发召回 · 真实能力投影</text><text class="small" x="1132" y="780">全局 / 工作区 / Provider 原生命名空间</text><rect class="pill" x="1132" y="794" width="166" height="26" rx="13"/><text class="pillText" x="1215" y="812" text-anchor="middle">可替换 Provider</text>
  </g>

  <text class="small" x="64" y="865">Mnemon · OpenViking · Honcho · Mem0 · Hindsight · Holographic · RetainDB · ByteRover · Supermemory</text>
  <line x1="1230" y1="860" x2="1274" y2="860" stroke="#9ba8bc" stroke-width="2.5"/><text class="small" x="1285" y="865">确定性路径</text>
  <line x1="1402" y1="860" x2="1446" y2="860" stroke="#6558d9" stroke-width="2.5" stroke-dasharray="8 7"/><text class="small" x="1457" y="865">Agent 路径</text>
</svg>
