name: Governance Harness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  governance:
    name: Governance Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Add language/runtime setup and a deterministic dependency install here.
      # The profile invokes project-native commands; their runtimes must exist.

      - name: Audit governance wiring
        run: python3 tools/agent-development-governance/governance.py audit --project . --strict-warnings

      - name: Run full project-native gates
        run: |
          python3 tools/agent-development-governance/governance.py verify \
            --project . \
            --changed-from "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --scope auto \
            --level full \
            --report "$RUNNER_TEMP/governance-attestation.json"

      - name: Reject stale or incomplete evidence
        run: |
          python3 tools/agent-development-governance/governance.py attest \
            --project . \
            --report "$RUNNER_TEMP/governance-attestation.json" \
            --require-level full

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-attestation
          path: ${{ runner.temp }}/governance-attestation.json
