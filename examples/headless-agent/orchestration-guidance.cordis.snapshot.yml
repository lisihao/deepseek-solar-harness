# Keyless schema inspection only: the graph is never submitted to the daemon.
- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: replay
  name: '@deepseek-ai/dsh-llm-replay'

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: orchestration-local
  name: '@deepseek-ai/dsh-orchestration-local'
  config:
    autoStart: false
    dshHome: !!js process.cwd() + '/.dsh'

- id: tool-orchestration
  name: '@deepseek-ai/dsh-tool-orchestration'
