- id: llm
  name: '@deepseek-ai/dsh-llm'
- id: workers
  name: '../../packages/orchestration/orchestration-local/tests/fixtures/offline-rlm/worker-host.mjs'
- id: runtime
  name: '@deepseek-ai/dsh-rlm-runtime-local'
  config:
    root: !!js process.env.DSH_HOME + '/runtime'
    kernel:
      kind: quickjs-wasm
      memoryLimitBytes: 67108864
      maxStackBytes: 524288
      maxInterruptChecks: 100000
      maxBridgeBytes: 2097152
      maxLogBytes: 8192
      maxCellSourceBytes: 65536
      maxHostCalls: 4096
      maxPendingHostCalls: 16
      jobBatchSize: 32
- id: local-http
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DSH_HTTP_TEST_AUTH
    baseURL: !!js process.env.DSH_HTTP_TEST_URL
    discoverModels: false
    models: []
    streamIdleTimeoutMs: 2000
