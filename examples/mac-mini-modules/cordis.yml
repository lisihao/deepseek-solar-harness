# MacBook overlay for full Mac mini application pages. SSH owns the target
# forwards; the plugin owns stable loopback relays that make frame-denying pages
# embeddable without changing the target applications.

- id: webserver
  config:
    host: 127.0.0.1
    port: 3081

- id: ui-remote-modules
  disabled: false
  config:
    instances:
      - id: research-workspace
        label: Research Workspace
        url: http://127.0.0.1:19001/
        relayPort: 29001
        order: 100
      - id: model-console
        label: Model Console
        url: http://127.0.0.1:19002/console/
        relayPort: 29002
        order: 200
