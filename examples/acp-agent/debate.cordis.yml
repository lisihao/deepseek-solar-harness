# Live composition for the Debate ACP snapshot. The fixture Provider is
# provider-neutral and never starts an external model or physical operator.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # Live authored acceptance mirrors the legacy direct-host route. The
      # fixture Debate Provider remains keyless and starts no external model.
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: dsh-debate-host
          model: debate
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a deterministic Debate host fixture. Your working directory is {{cwd}}.
      - insert:
          - id: debate-fixture
            name: './tests/fixtures/debate-loader.ts'
          - id: tool-debate
            name: '@deepseek-ai/dsh-tool-debate'
