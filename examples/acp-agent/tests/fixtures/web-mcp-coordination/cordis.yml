# The fixture mounts the production resident coordinator. Its browser and
# native-product plugins are the only fake external boundaries.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: browser
            name: '@deepseek-ai/dsh-browser'
          - id: user-questions
            name: '@deepseek-ai/dsh-user-questions'
          - id: physical-operator
            name: '@deepseek-ai/dsh-physical-operator'
          - id: web-mcp-native-operator
            name: './tests/fixtures/web-mcp-coordination/native-operator.ts'
          - id: web-mcp-browser
            name: './tests/fixtures/web-mcp-coordination/browser.ts'
          - id: task-template
            name: './tests/fixtures/task-template/provider.ts'
            config:
              dshHome: !!js process.env.DSH_HOME
              watch: false
          - id: task-template-context
            name: './tests/fixtures/task-template/context.ts'
          - id: task-template-context-invariant
            name: './tests/fixtures/task-template/context-invariant.ts'
          - id: physical-operator-chatgpt-web
            name: '@deepseek-ai/dsh-physical-operator-chatgpt-web'
            config:
              stateRoot: !!js process.env.DSH_HOME + '/web-mcp-state'
              coordinatorEnabled: true
              coordinatorPort: !!js Number(process.env.DSH_WEB_MCP_PORT)
              coordinatorRequestMaxBytes: 16384
              coordinatorRequestTimeoutMs: 2000
              identityTimeoutMs: 500
              generationTimeoutMs: 2000
              submissionTimeoutMs: 500
              pollIntervalMs: 1
              progressIntervalMs: 1000
              outputMaxBytes: 4096
          - id: tool-physical-operator
            name: '@deepseek-ai/dsh-tool-physical-operator'
