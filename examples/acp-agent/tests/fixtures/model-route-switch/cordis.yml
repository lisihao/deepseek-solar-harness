# Keyless route-switch composition: keep the real ACP spine, AgentLoop, model
# selection handler, physical router, and ChatGPT Web provider.  The fixture
# replaces only the external browser and Claude native-subscription boundaries.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: browser
            name: '@deepseek-ai/dsh-browser'
          - id: user-questions
            name: '@deepseek-ai/dsh-user-questions'
          - id: physical-operator
            name: '@deepseek-ai/dsh-physical-operator'
          - id: route-switch-external-providers
            name: './tests/fixtures/model-route-switch/external-providers.ts'
          - id: physical-operator-chatgpt-web
            name: '@deepseek-ai/dsh-physical-operator-chatgpt-web'
            config:
              generationTimeoutMs: 2000
              submissionTimeoutMs: 500
              pollIntervalMs: 1
              progressIntervalMs: 1000
          - id: tool-physical-operator
            name: '@deepseek-ai/dsh-tool-physical-operator'
