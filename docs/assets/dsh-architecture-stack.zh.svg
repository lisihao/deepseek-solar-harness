<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
  <title id="title">DSH 3.9.9 分层架构</title>
  <desc id="desc">DSH 从交互入口、插件组合、Agent 运行时、编排控制、执行分配到模型算子的分层堆栈，右侧为贯穿各层的治理与发布，底部为持久状态权威。</desc>
  <defs>
    <style>
      .canvas { fill: #f7f9fc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 500; }
      .layer-label { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; }
      .layer-index { fill: #dbeafe; font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .layer-note { fill: #eef4ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 600; }
      .card-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; }
      .card-note { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; }
      .rail-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 21px; font-weight: 700; }
      .rail-label { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; }
      .rail-note { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; }
      .authority-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 700; }
      .authority-subtitle { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 600; }
      .authority-label { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; font-weight: 700; }
      .authority-note { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 500; }
      .footer { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 500; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect class="canvas" width="1440" height="1160"/>
  <rect class="frame" x="28" y="28" width="1384" height="1104" rx="18" filter="url(#shadow)"/>

  <text class="title" x="62" y="82">DSH 3.9.9 · 分层 Agent Runtime</text>
  <text class="subtitle" x="62" y="112">一个控制平面 · 插件化能力接缝 · 可替换模型 Provider · 跨重启持久恢复</text>
  <line x1="62" y1="135" x2="1378" y2="135" stroke="#d9e2ec" stroke-width="2"/>

  <!-- 01 Interaction -->
  <g transform="translate(62 160)">
    <rect width="1030" height="108" rx="12" fill="#eef4ff" stroke="#9dbcf8" stroke-width="2"/>
    <path d="M12 0 H224 V108 H12 Q0 108 0 96 V12 Q0 0 12 0Z" fill="#315b9d"/>
    <text class="layer-index" x="26" y="33">LAYER 01</text>
    <text class="layer-label" x="26" y="65">交互入口</text>
    <text class="layer-note" x="26" y="88">用户与自动化</text>
    <g transform="translate(244 18)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#bfd0ef"/>
      <text class="card-title" x="18" y="31">DSH Desktop</text>
      <text class="card-note" x="18" y="53">Local Server / Remote Frontend</text>
    </g>
    <g transform="translate(496 18)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#bfd0ef"/>
      <text class="card-title" x="18" y="31">Web / CLI / SDK</text>
      <text class="card-note" x="18" y="53">浏览器、终端与自动化入口</text>
    </g>
    <g transform="translate(748 18)">
      <rect width="262" height="72" rx="8" fill="#ffffff" stroke="#bfd0ef"/>
      <text class="card-title" x="18" y="31">多 Server 控制</text>
      <text class="card-note" x="18" y="53">目录、健康检查、Leader 跟随</text>
    </g>
  </g>

  <!-- 02 Composition -->
  <g transform="translate(62 282)">
    <rect width="1030" height="108" rx="12" fill="#edfafa" stroke="#89cccc" stroke-width="2"/>
    <path d="M12 0 H224 V108 H12 Q0 108 0 96 V12 Q0 0 12 0Z" fill="#217d7a"/>
    <text class="layer-index" x="26" y="33" fill="#c8f3f0">LAYER 02</text>
    <text class="layer-label" x="26" y="65">插件组合</text>
    <text class="layer-note" x="26" y="88">能力装配，不复制状态机</text>
    <g transform="translate(244 18)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#add9d7"/>
      <text class="card-title" x="18" y="31">Profile / Bundle</text>
      <text class="card-note" x="18" y="53">选择产品形态与 Provider</text>
    </g>
    <g transform="translate(496 18)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#add9d7"/>
      <text class="card-title" x="18" y="31">Cordis 插件运行时</text>
      <text class="card-note" x="18" y="53">Service / Provider / Consumer</text>
    </g>
    <g transform="translate(748 18)">
      <rect width="262" height="72" rx="8" fill="#ffffff" stroke="#add9d7"/>
      <text class="card-title" x="18" y="31">Managed / User Plugins</text>
      <text class="card-note" x="18" y="53">可装卸能力与 UI 投影</text>
    </g>
  </g>

  <!-- 03 Agent runtime -->
  <g transform="translate(62 404)">
    <rect width="1030" height="108" rx="12" fill="#f2f0ff" stroke="#b9afea" stroke-width="2"/>
    <path d="M12 0 H224 V108 H12 Q0 108 0 96 V12 Q0 0 12 0Z" fill="#6554a8"/>
    <text class="layer-index" x="26" y="33" fill="#e6e0ff">LAYER 03</text>
    <text class="layer-label" x="26" y="65">Agent 运行时</text>
    <text class="layer-note" x="26" y="88">交互回合与工具世界</text>
    <g transform="translate(244 18)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#cbc3ef"/>
      <text class="card-title" x="18" y="31">Session / Agent Loop</text>
      <text class="card-note" x="18" y="53">Turn、Step、Steering、Follow-up</text>
    </g>
    <g transform="translate(496 18)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#cbc3ef"/>
      <text class="card-title" x="18" y="31">Prompt / Context / Preset</text>
      <text class="card-note" x="18" y="53">模型可见输入与策略</text>
    </g>
    <g transform="translate(748 18)">
      <rect width="262" height="72" rx="8" fill="#ffffff" stroke="#cbc3ef"/>
      <text class="card-title" x="18" y="31">Typed Tools / Approval / Trace</text>
      <text class="card-note" x="18" y="53">FS、Shell、LSP、MCP、Workflow</text>
    </g>
  </g>

  <!-- 04 Orchestration -->
  <g transform="translate(62 526)">
    <rect width="1030" height="118" rx="12" fill="#fff7e8" stroke="#e9bd71" stroke-width="2"/>
    <path d="M12 0 H224 V118 H12 Q0 118 0 106 V12 Q0 0 12 0Z" fill="#a96812"/>
    <text class="layer-index" x="26" y="35" fill="#ffebbf">LAYER 04</text>
    <text class="layer-label" x="26" y="68">编排控制</text>
    <text class="layer-note" x="26" y="93">唯一 TaskGraph Authority</text>
    <g transform="translate(244 23)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#edce99"/>
      <text class="card-title" x="18" y="31">Intent / Context / Capsule</text>
      <text class="card-note" x="18" y="53">版本化 IR 与晚绑定能力</text>
    </g>
    <g transform="translate(496 23)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#edce99"/>
      <text class="card-title" x="18" y="31">Certified TaskGraph</text>
      <text class="card-note" x="18" y="53">DAG、冲突控制、审批、恢复</text>
    </g>
    <g transform="translate(748 23)">
      <rect width="262" height="72" rx="8" fill="#ffffff" stroke="#edce99"/>
      <text class="card-title" x="18" y="31">RLM / Harness / Debate</text>
      <text class="card-note" x="18" y="53">同一控制面内的可选执行策略</text>
    </g>
  </g>

  <!-- 05 Allocation and execution -->
  <g transform="translate(62 658)">
    <rect width="1030" height="118" rx="12" fill="#eef8f0" stroke="#9bc8a4" stroke-width="2"/>
    <path d="M12 0 H224 V118 H12 Q0 118 0 106 V12 Q0 0 12 0Z" fill="#39774a"/>
    <text class="layer-index" x="26" y="35" fill="#d8f1de">LAYER 05</text>
    <text class="layer-label" x="26" y="68">执行与分配</text>
    <text class="layer-note" x="26" y="93">密封计划与物理派发</text>
    <g transform="translate(244 23)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#b9d7bf"/>
      <text class="card-title" x="18" y="31">Model Allocator</text>
      <text class="card-note" x="18" y="53">套餐、配额、成本、速度、质量</text>
    </g>
    <g transform="translate(496 23)">
      <rect width="236" height="72" rx="8" fill="#ffffff" stroke="#b9d7bf"/>
      <text class="card-title" x="18" y="31">Resident Operator</text>
      <text class="card-note" x="18" y="53">Session、Receipt、Lease、Artifact</text>
    </g>
    <g transform="translate(748 23)">
      <rect width="262" height="72" rx="8" fill="#ffffff" stroke="#b9d7bf"/>
      <text class="card-title" x="18" y="31">Remote Execution / Cluster</text>
      <text class="card-note" x="18" y="53">隔离工作区、远程算子、Leader</text>
    </g>
  </g>

  <!-- 06 Providers -->
  <g transform="translate(62 790)">
    <rect width="1030" height="108" rx="12" fill="#fff1ee" stroke="#e7a89c" stroke-width="2"/>
    <path d="M12 0 H224 V108 H12 Q0 108 0 96 V12 Q0 0 12 0Z" fill="#a94f40"/>
    <text class="layer-index" x="26" y="33" fill="#ffe0da">LAYER 06</text>
    <text class="layer-label" x="26" y="65">模型与算子</text>
    <text class="layer-note" x="26" y="88">可替换执行 Provider</text>
    <g transform="translate(244 18)">
      <rect width="180" height="72" rx="8" fill="#ffffff" stroke="#ecc2ba"/>
      <text class="card-title" x="18" y="31">DeepSeek API</text>
      <text class="card-note" x="18" y="53">Pro / Flash</text>
    </g>
    <g transform="translate(440 18)">
      <rect width="220" height="72" rx="8" fill="#ffffff" stroke="#ecc2ba"/>
      <text class="card-title" x="18" y="31">Claude Code 订阅</text>
      <text class="card-note" x="18" y="53">原生登录态与持久 Session</text>
    </g>
    <g transform="translate(676 18)">
      <rect width="200" height="72" rx="8" fill="#ffffff" stroke="#ecc2ba"/>
      <text class="card-title" x="18" y="31">Codex 订阅</text>
      <text class="card-note" x="18" y="53">Sol / Terra / Luna / Spark</text>
    </g>
    <g transform="translate(892 18)">
      <rect width="118" height="72" rx="8" fill="#ffffff" stroke="#ecc2ba"/>
      <text class="card-title" x="18" y="31">本地工具</text>
      <text class="card-note" x="18" y="53">Shell / FS</text>
    </g>
  </g>

  <!-- Cross-layer governance rail -->
  <g transform="translate(1110 160)">
    <rect width="268" height="738" rx="12" fill="#eef2f6" stroke="#a8b4c3" stroke-width="2"/>
    <path d="M12 0 H256 Q268 0 268 12 V82 H0 V12 Q0 0 12 0Z" fill="#27364a"/>
    <text class="rail-title" x="24" y="36">治理与发布</text>
    <text class="layer-note" x="24" y="61">贯穿全部运行层</text>
    <line x1="24" y1="109" x2="244" y2="109" stroke="#c4ced9"/>
    <text class="rail-label" x="24" y="143">Code-as-Harness</text>
    <text class="rail-note" x="24" y="166">规则、计划、验证、证明</text>
    <line x1="24" y1="195" x2="244" y2="195" stroke="#c4ced9"/>
    <text class="rail-label" x="24" y="229">插件来源治理</text>
    <text class="rail-note" x="24" y="252">Registry、Commit、License</text>
    <line x1="24" y1="281" x2="244" y2="281" stroke="#c4ced9"/>
    <text class="rail-label" x="24" y="315">Trace 与 Evidence</text>
    <text class="rail-note" x="24" y="338">Session、Run、Operator 证据</text>
    <line x1="24" y1="367" x2="244" y2="367" stroke="#c4ced9"/>
    <text class="rail-label" x="24" y="401">权限与审批</text>
    <text class="rail-note" x="24" y="424">Scope、Effect、Secret、Risk</text>
    <line x1="24" y1="453" x2="244" y2="453" stroke="#c4ced9"/>
    <text class="rail-label" x="24" y="487">计费与配额</text>
    <text class="rail-note" x="24" y="510">本地账本、官方余额、节省</text>
    <line x1="24" y1="539" x2="244" y2="539" stroke="#c4ced9"/>
    <text class="rail-label" x="24" y="573">受保护 PR / CI</text>
    <text class="rail-note" x="24" y="596">合并门禁与平台矩阵</text>
    <line x1="24" y1="625" x2="244" y2="625" stroke="#c4ced9"/>
    <text class="rail-label" x="24" y="659">产品身份与发布</text>
    <text class="rail-note" x="24" y="682">Source / Package / Runtime</text>
  </g>

  <!-- Durable authority -->
  <g transform="translate(62 922)">
    <rect width="1316" height="146" rx="12" fill="#1f2b3a"/>
    <text class="authority-title" x="24" y="38">持久状态权威</text>
    <text class="authority-subtitle" x="24" y="62">每类状态仅有一个写者</text>
    <g transform="translate(224 22)">
      <rect width="252" height="100" rx="8" fill="#ffffff"/>
      <text class="authority-label" x="18" y="31">Session Events</text>
      <text class="authority-note" x="18" y="55">模型可见历史与用户投影</text>
      <text class="authority-note" x="18" y="77">Owner：Session Runtime</text>
    </g>
    <g transform="translate(492 22)">
      <rect width="252" height="100" rx="8" fill="#ffffff"/>
      <text class="authority-label" x="18" y="31">Orchestration SQLite + CAS</text>
      <text class="authority-note" x="18" y="55">Graph、Attempt、Evidence</text>
      <text class="authority-note" x="18" y="77">Owner：dsh-orchestratord</text>
    </g>
    <g transform="translate(760 22)">
      <rect width="252" height="100" rx="8" fill="#ffffff"/>
      <text class="authority-label" x="18" y="31">Receipt / Lease / Artifact</text>
      <text class="authority-note" x="18" y="55">原生算子命令与恢复状态</text>
      <text class="authority-note" x="18" y="77">Owner：resident-operatord</text>
    </g>
    <g transform="translate(1028 22)">
      <rect width="264" height="100" rx="8" fill="#ffffff"/>
      <text class="authority-label" x="18" y="31">Native Product Sessions</text>
      <text class="authority-note" x="18" y="55">Claude Code / Codex 私有历史</text>
      <text class="authority-note" x="18" y="77">Owner：各原生产品</text>
    </g>
  </g>

  <text class="footer" x="62" y="1107">阅读方式：从上到下是产品分层；右栏是跨层治理；底栏是不可复制的持久状态权威。</text>
</svg>
