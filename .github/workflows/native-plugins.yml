name: Native plugin checks
on:
  pull_request:
  push:
    branches: [v4]
permissions:
  contents: read
jobs:
  source-and-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.31.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install and verify the memory context adapter
        if: ${{ hashFiles('incubator/memory-context/package.json') != '' }}
        run: |
          pnpm --dir incubator/memory-context install --frozen-lockfile --ignore-scripts
          pnpm --dir incubator/memory-context build
          pnpm --dir incubator/memory-context typecheck
          pnpm --dir incubator/memory-context test:plugin
      - run: pnpm check
