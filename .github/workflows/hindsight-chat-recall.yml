name: Hindsight chat recall
on:
  pull_request:
    paths:
      - 'incubator/hindsight-chat-recall/**'
      - '.github/workflows/hindsight-chat-recall.yml'
  push:
    branches: [v4]
    paths:
      - 'incubator/hindsight-chat-recall/**'
      - '.github/workflows/hindsight-chat-recall.yml'
permissions:
  contents: read
jobs:
  built-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: incubator/hindsight-chat-recall
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@10.31.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build && pnpm typecheck && pnpm test && pnpm test:plugin
