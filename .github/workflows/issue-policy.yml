name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Bind trusted policy to this repository
        env:
          DSH_REPOSITORY: ${{ github.repository }}
        run: >-
          node -e 'const fs=require("node:fs"); const [organization,repository]=process.env.DSH_REPOSITORY.split("/");
          const path=".github/issue-management/config.json"; const config=JSON.parse(fs.readFileSync(path,"utf8"));
          fs.writeFileSync(path,JSON.stringify({...config,organization,repository},null,2)+"\n")'
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
