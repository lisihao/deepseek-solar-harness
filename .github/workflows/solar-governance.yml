name: Solar Code-as-Harness

on:
  pull_request:
    branches: [solar]
  push:
    branches: [solar]
  workflow_dispatch:

concurrency:
  group: solar-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            plugins/managed/agent-teams/pnpm-lock.yaml
            plugins/managed/better-sidebar/pnpm-lock.yaml
            plugins/managed/genui/pnpm-lock.yaml
            plugins/managed/llm-fallbacks/pnpm-lock.yaml
            plugins/managed/mnemon/pnpm-lock.yaml
            plugins/managed/web-ui/pnpm-lock.yaml
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-desktop-yarn-${{ hashFiles('products/desktop/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-yarn-
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack yarn install --immutable
        working-directory: products/desktop
      - run: corepack pnpm install --ignore-workspace --frozen-lockfile
        working-directory: plugins/managed/agent-teams
      - name: Install controlled pnpm plugin dependencies
        run: |
          for plugin in better-sidebar genui llm-fallbacks mnemon; do
            (cd "plugins/managed/$plugin" && corepack pnpm --ignore-workspace install --frozen-lockfile)
          done
      - name: Install controlled npm plugin dependencies
        run: |
          for plugin in plugin-check tool-markdown tool-regex tool-stat tool-time; do
            npm ci --prefix "plugins/managed/$plugin"
          done
      - run: corepack pnpm install --frozen-lockfile
        working-directory: plugins/managed/web-ui
      - run: python3 tools/agent-development-governance/governance.py audit --project . --strict-warnings
      - run: python3 tools/agent-development-governance/governance.py plan --project . --scope auto --level full --changed-from origin/solar
      - run: mkdir -p .artifacts
      - run: python3 tools/agent-development-governance/governance.py verify --project . --scope auto --level full --changed-from origin/solar --report .artifacts/solar-governance.json
      - run: python3 tools/agent-development-governance/governance.py attest --project . --report .artifacts/solar-governance.json --require-level full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-governance-attestation
          path: .artifacts/solar-governance.json
          if-no-files-found: warn
